# WinDrop iOS uygulaması — XcodeGen tanımı (docs/APP-IOS.md).
# Üretim:  xcodegen generate --spec ios/App/project.yml
#
# Paket kimliği: WINDROP_BUNDLE_ID değişkeni (varsayılan com.efe.windrop). Komut satırından
# değiştirmek için:  xcodebuild ... WINDROP_BUNDLE_ID=com.ornek.windrop
#
# Etkin nokta (NEHotspotConfiguration) yetkisi YALNIZ ücretli geliştirici hesabıyla vardır.
# Ücretsiz hesapta varsayılan "Release"/"Debug" yapılandırmaları kullanılır (yetki yok).
# Ücretli hesapta "Release-Hotspot" yapılandırması WinDrop-Hotspot.entitlements dosyasını
# bağlar ve HOTSPOT_ENTITLEMENT derleme bayrağını açar.
# Push bildirimi (APNs, docs/PROTOCOL.md §9) da YALNIZ ücretli hesapla çalışır: "Release-Push" yapılandırması
# WinDrop-Push.entitlements (aps-environment) dosyasını bağlar ve PUSH_ENABLED derleme bayrağını açar. Ücretsiz hesapta
# push kodu hiç derlenmez. (Hotspot ve Push'u birlikte istiyorsanız iki yetkiyi tek dosyada birleştirip bayrakları ekleyin.)
# Paylaşım Uzantısı (WinDropShare, iOS paylaşım menüsü): Shared/ klasörü iki hedefe de derlenir; ShareExtension/ yalnız uzantıdır.
# Tek kimlik: iki hedefe `com.apple.security.application-groups` = group.$(WINDROP_BUNDLE_ID) yetkisi verilir (*.entitlements) ve
# Info.plist `WinDropAppGroup` aynı adı taşır. Uygulama ve uzantı böylece aynı cihaz anahtarını, tanıdık PC listesini (Keychain,
# erişim grubu = App Group kimliği) ve ayarları (UserDefaults paketi) paylaşır. Grup imzalamada kaydedilmediyse (ücretsiz hesap /
# Sideloadly) çalışma zamanında algılanır (SharedGroup.swift) ve uzantı kendi kimliğiyle çalışır. Ana uygulamanın mevcut anahtarı
# ilk açılışta ortak depoya taşınır (kimlik değişmez). Cihaz adı Ayarlar'dan elle girilir (iOS adı okutmaz).
#
# Yerelleştirme (Türkçe kaynak + İngilizce): Localization/Localizable.xcstrings iki hedefte de derlenir (SwiftUI Text/Label
# anahtarları = Türkçe metin; String için String(localized:)). İzin metinleri hedef başına InfoPlist.xcstrings
# (Localization/App, Localization/Share). Uygulama dili iOS'un "uygulama başına dil" ayarından seçilir (Ayarlar > WinDrop > Dil);
# uygulama içinde dil zorlanmaz. Kontrol: py -3 ios/App/Localization/check-xcstrings.py

name: WinDrop

options:
  bundleIdPrefix: com.efe
  developmentLanguage: tr
  # Bilinen bölgeler: tr (kaynak) + en. Not: bazı XcodeGen sürümleri bu anahtarı tanımaz (yok sayılır); çalışma zamanında
  # diller aşağıdaki CFBundleLocalizations ve .xcstrings içeriğinden gelir.
  knownRegions: [tr, en]
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  Release-Hotspot: release
  Release-Push: release

packages:
  WinDropKit:
    path: ../WinDropKit

settings:
  base:
    # Swift 6 uyumlu yazıldı; Mac olmadan ilk derlemede dil kipi 5 + tam denetimle (uyarı) başlıyor.
    # Uyarılar temizlenince SWIFT_VERSION "6.0" yapılacak (TODO).
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES   # String Catalog (Localization/*.xcstrings) anahtar çıkarımı
    WINDROP_BUNDLE_ID: com.efe.windrop
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WinDrop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
      - path: Localization/Localizable.xcstrings
      - path: Localization/App   # InfoPlist.xcstrings (izin metinleri)
    dependencies:
      - package: WinDropKit
      - target: WinDropShare   # PlugIns/WinDropShare.appex olarak gömülür
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WinDrop
        CFBundleLocalizations: [tr, en]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: WinDrop, yakındaki bilgisayarları Bluetooth ile bulmak ve dosya aktarımı için onlara sinyal göndermek üzere Bluetooth kullanır.
        NSCameraUsageDescription: İsteğe bağlı otomatik kabul eşleştirmesi için bilgisayarınızın ekranındaki QR kodu okumak üzere kamera gerekir.
        NSLocalNetworkUsageDescription: Aynı ağdaki bilgisayarınıza dosya göndermek veya ondan dosya almak için yerel ağa erişim gerekir.
        NSBonjourServices:
          - _windrop._tcp
        NSPhotoLibraryAddUsageDescription: Bilgisayardan aldığınız fotoğraf ve videoları Fotoğraflar'a kaydetmek için izin gerekir.
        LSApplicationQueriesSchemes:   # canOpenURL: aktarım satırından Fotoğraflar / Dosyalar açma
          - photos-redirect
          - shareddocuments
        UIBackgroundModes:
          - bluetooth-central
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        WinDropAppGroup: group.$(WINDROP_BUNDLE_ID)   # SharedGroup.swift okur (ortak cihaz kimliği/ayarlar)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WINDROP_BUNDLE_ID)
        PRODUCT_NAME: WinDrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: WinDrop.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release-Hotspot:
          CODE_SIGN_ENTITLEMENTS: WinDrop-Hotspot.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOTSPOT_ENTITLEMENT"
        Release-Push:
          CODE_SIGN_ENTITLEMENTS: WinDrop-Push.entitlements
          # PUSH_SANDBOX: APNs sandbox ortamı (aps-environment = development; Sideloadly/geliştirici imzası). Production
          # yetkisiyle (App Store/TestFlight) dağıtılacaksa yalnız bu bayrak kaldırılır.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PUSH_ENABLED PUSH_SANDBOX"

  WinDropShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
      - path: Shared
      - path: Assets.xcassets   # paylaşım uzantısı da aynı simgeyi gösterir
      - path: Localization/Localizable.xcstrings   # uygulamayla ortak metinler
      - path: Localization/Share   # InfoPlist.xcstrings (uzantının izin metinleri)
    dependencies:
      - package: WinDropKit
    info:
      path: WinDropShare-Info.plist
      properties:
        CFBundleDisplayName: WinDrop
        CFBundleLocalizations: [tr, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: WinDrop, paylaştığınız dosyaları göndermek için yakındaki bilgisayarları Bluetooth ile bulur.
        NSLocalNetworkUsageDescription: Aynı ağdaki bilgisayarınıza dosya göndermek için yerel ağa erişim gerekir.
        NSBonjourServices:
          - _windrop._tcp
        WinDropAppGroup: group.$(WINDROP_BUNDLE_ID)   # SharedGroup.swift okur (ortak cihaz kimliği/ayarlar)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WINDROP_BUNDLE_ID).share
        CODE_SIGN_ENTITLEMENTS: WinDropShare.entitlements
        PRODUCT_NAME: WinDropShare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  WinDrop:
    build:
      targets:
        WinDrop: all
    run:
      config: Debug
    archive:
      config: Release
