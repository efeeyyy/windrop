name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - 'protocol/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: dotnet test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: dotnet sürümü
        run: dotnet --version

      - name: Test
        run: dotnet test windows/WinDrop.slnx -c Release --nologo
