name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - 'protocol/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      push_build:
        description: 'Release-Push derlemesini de çalıştır'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit-linux:
    name: WinDropKit (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ios/WinDropKit/.build
          key: spm-linux-${{ hashFiles('ios/WinDropKit/Package.swift', 'ios/WinDropKit/Package.resolved') }}
          restore-keys: spm-linux-
      - name: Swift sürümü
        run: swift --version
      - name: swift test
        working-directory: ios/WinDropKit
        run: swift test

  app-macos:
    name: Uygulama (macOS, imzasız IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # push öncesi commit ile fark için

      - name: Araç zinciri sürümleri
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: ios/WinDropKit/.build
          key: spm-macos-${{ hashFiles('ios/WinDropKit/Package.swift', 'ios/WinDropKit/Package.resolved') }}
          restore-keys: spm-macos-

      - name: WinDropKit swift test (CryptoKit yolu)
        working-directory: ios/WinDropKit
        run: swift test

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate --spec ios/App/project.yml

      - name: Archive (imzasız, Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/WinDrop.xcodeproj \
            -scheme WinDrop \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            -archivePath "$RUNNER_TEMP/WinDrop.xcarchive" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 120

      - name: Derleme hata özeti
        if: always()
        run: |
          test -f "$RUNNER_TEMP/xcodebuild.log" || exit 0
          echo "--- error satırları ---"
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -n 80 || true
          echo "--- concurrency uyarıları (sayı) ---"
          grep -E "warning:.*(Sendable|actor-isolated|concurrency)" "$RUNNER_TEMP/xcodebuild.log" | sort -u | wc -l || true

      # CODE_SIGNING_ALLOWED=NO ile yetkiler ikiliye gömülmez; Sideloadly/SideStore ise App Group'u ikilinin
      # imzasındaki yetkilerden okur. Yetkiler ad-hoc imzayla gömülür (kullanıcının aracı kendi hesabıyla yeniden imzalar).
      - name: Yetkileri göm (ad-hoc imza)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/WinDrop.xcarchive/Products/Applications/WinDrop.app"
          APPEX="$APP/PlugIns/WinDropShare.appex"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Paket kimliği: $BID"
          # İç içe kod önce imzalanır (gömülü framework/dylib varsa), sonra uzantı, en son uygulama.
          find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -prune -print | while read -r f; do
            codesign --force --sign - --timestamp=none "$f"
          done
          sign() {  # $1 = yetki dosyası (ios/App altında), $2 = paket
            local ent="$RUNNER_TEMP/$1"
            sed -e "s/[$](WINDROP_BUNDLE_ID)/$BID/g" "ios/App/$1" > "$ent"
            plutil -lint "$ent"
            codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements "$ent" "$2"
            codesign -d --entitlements :- "$2" 2>/dev/null | grep -F "group.$BID" \
              || { echo "HATA: $2 içinde group.$BID yetkisi yok"; exit 1; }
          }
          sign WinDropShare.entitlements "$APPEX"
          sign WinDrop.entitlements "$APP"
          codesign --verify --deep --strict "$APP"

      - name: IPA oluştur (Payload/WinDrop.app + PlugIns/WinDropShare.appex)
        run: |
          APP="$RUNNER_TEMP/WinDrop.xcarchive/Products/Applications/WinDrop.app"
          test -d "$APP"
          # Paylaşım Uzantısı gömülü olmalı (.app/PlugIns/WinDropShare.appex).
          APPEX="$APP/PlugIns/WinDropShare.appex"
          test -d "$APPEX" || { echo "HATA: $APPEX yok (uzantı gömülmedi)"; ls -R "$APP" | head -n 40; exit 1; }
          test -f "$APPEX/Info.plist"
          echo "Uzantı bulundu: $APPEX"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/WinDrop-unsigned.ipa" Payload)
          ls -l "$GITHUB_WORKSPACE/WinDrop-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/WinDrop-unsigned.ipa" | grep -F "Payload/WinDrop.app/PlugIns/WinDropShare.appex/Info.plist"

      - name: IPA yükle
        uses: actions/upload-artifact@v5
        with:
          name: WinDrop-unsigned-ipa
          path: WinDrop-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Derleme günlüğünü yükle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Push ile ilgili dosyalar değişti mi?
        id: pushchanged
        run: |
          # push olayında önceki commit ile karşılaştır; ilk push/dispatch'te değişti sayılmaz.
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' &&
             git cat-file -e "$BEFORE" 2>/dev/null &&
             ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- ':(glob)ios/App/**/Push/**'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-Push derlemesi (PUSH_ENABLED, imzasız; archive değil)
        if: ${{ inputs.push_build == true || steps.pushchanged.outputs.changed == 'true' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/WinDrop.xcodeproj \
            -scheme WinDrop \
            -sdk iphoneos \
            -configuration Release-Push \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-push.log" | tail -n 60

      - name: Release-Push hata özeti
        if: ${{ failure() && (inputs.push_build == true || steps.pushchanged.outputs.changed == 'true') }}
        run: |
          test -f "$RUNNER_TEMP/xcodebuild-push.log" || exit 0
          grep -E "error:" "$RUNNER_TEMP/xcodebuild-push.log" | sort -u | head -n 80 || true
